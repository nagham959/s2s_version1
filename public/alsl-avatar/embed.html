<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CWASA Embed Avatar</title>
  <link rel="stylesheet" href="cwa/cwasa.css?v=marc-force" />
  <script src="cwa/allcsa.js?v=marc-force"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 50%, #fcd34d 100%);
      font-family: Arial, sans-serif;
    }

    .avatar-shell {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .CWASAAvatar.av0 {
      width: 100%;
      height: 100%;
    }

    .menu-wrap,
    .CWASAAvMenu,
    .CWASAAvMenu * {
      display: none !important;
    }

  </style>
  <script>
    (function () {
      var isReady = false;
      var queuedSigml = null;

      function forceMarcAvatar() {
        try {
          if (window.CWASA) {
            var cfg = window.CWASA.theConfig || window.CWASA.config || {};
            cfg.avs = ['marc'];
            cfg.avsfull = ['marc'];
            cfg.initAv = 'marc';
          }

          if (window.CWASA && window.CWASA.avatar && typeof window.CWASA.avatar.switchAvatar === 'function') {
            window.CWASA.avatar.switchAvatar('marc');
            return true;
          }

          var menu = document.querySelector('.menuAv');
          if (menu) {
            menu.value = 'marc';
            menu.dispatchEvent(new Event('change'));
            return true;
          }
        } catch (e) {
          console.error(e);
        }

        return false;
      }

      function initCWASA() {
        if (!window.CWASA || typeof window.CWASA.init !== 'function') {
          console.error('CWASA is not available.');
          return;
        }
        CWASA.init({ initAv: 'marc', avs: ['marc'] });
        isReady = true;

        if (!forceMarcAvatar()) {
          var tries = 0;
          var timer = setInterval(function () {
            tries++;
            if (forceMarcAvatar() || tries > 25) {
              clearInterval(timer);
            }
          }, 200);
        }

        if (queuedSigml) {
          playSiGML(queuedSigml);
          queuedSigml = null;
        }
      }

      function playSiGML(sigmlContent) {
        var xml = typeof sigmlContent === 'string' ? sigmlContent.trim() : '';
        if (!xml) return;

        if (!isReady) {
          queuedSigml = xml;
          return;
        }

        if (window.CWASA && typeof window.CWASA.playSiGMLText === 'function') {
          CWASA.playSiGMLText(xml);
        }
      }

      window.playSiGML = playSiGML;

      window.addEventListener('message', function (event) {
        var data = event && event.data ? event.data : null;
        if (!data || typeof data !== 'object') return;

        if (data.type === 'PLAY_SIGML' && typeof data.payload === 'string') {
          playSiGML(data.payload);
        }
      });

      window.addEventListener('load', initCWASA);
    })();
  </script>
</head>
<body>
  <div class="avatar-shell">
    <div class="CWASAAvatar av0"></div>
  </div>
</body>
</html>
