<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CWASA Embed Avatar</title>
  <link rel="stylesheet" href="cwa/cwasa.css" />
  <script src="cwa/allcsa.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
    }

    .avatar-shell {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .CWASAAvatar.av0 {
      width: 100%;
      height: 100%;
    }

    .menu-wrap {
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(15, 23, 42, 0.12);
      border-radius: 8px;
      padding: 2px 8px;
      font-size: 12px;
      color: #0f172a;
      z-index: 5;
      backdrop-filter: blur(2px);
    }

  </style>
  <script>
    (function () {
      var isReady = false;
      var queuedSigml = null;

      function initCWASA() {
        if (!window.CWASA || typeof window.CWASA.init !== 'function') {
          console.error('CWASA is not available.');
          return;
        }
        CWASA.init();
        isReady = true;

        if (queuedSigml) {
          playSiGML(queuedSigml);
          queuedSigml = null;
        }
      }

      function playSiGML(sigmlContent) {
        var xml = typeof sigmlContent === 'string' ? sigmlContent.trim() : '';
        if (!xml) return;

        if (!isReady) {
          queuedSigml = xml;
          return;
        }

        if (window.CWASA && typeof window.CWASA.playSiGMLText === 'function') {
          CWASA.playSiGMLText(xml);
        }
      }

      window.playSiGML = playSiGML;

      window.addEventListener('message', function (event) {
        var data = event && event.data ? event.data : null;
        if (!data || typeof data !== 'object') return;

        if (data.type === 'PLAY_SIGML' && typeof data.payload === 'string') {
          playSiGML(data.payload);
        }
      });

      window.addEventListener('load', initCWASA);
    })();
  </script>
</head>
<body>
  <div class="avatar-shell">
    <div class="CWASAAvatar av0"></div>
    <div class="menu-wrap">
      <span class="CWASAAvMenu av0"></span>
    </div>
  </div>
</body>
</html>
