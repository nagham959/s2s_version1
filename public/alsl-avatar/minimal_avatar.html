<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Minimal ALSL Avatar</title>
    <link rel="stylesheet" href="cwa/cwasa.css?v=marc-force" />
    <script type="text/javascript" src="cwa/allcsa.js?v=marc-force"></script>
    <script type="text/javascript">
        function playSiGML(sigmlContent) {
            if (window.CWASA && typeof window.CWASA.playSiGMLText === 'function') {
                CWASA.playSiGMLText(sigmlContent);
            }
        }

        function forceMarcAvatar() {
            try {
                if (window.CWASA && window.CWASA.avatar && typeof window.CWASA.avatar.switchAvatar === 'function') {
                    window.CWASA.avatar.switchAvatar('marc');
                    return true;
                }

                var menu = document.querySelector('.menuAv');
                if (menu) {
                    menu.value = 'marc';
                    menu.dispatchEvent(new Event('change'));
                    return true;
                }
            } catch (e) {
                console.error(e);
            }

            return false;
        }

        function initializeAvatar() {
            if (window.CWASA && typeof window.CWASA.init === 'function') {
                try {
                    CWASA.init({ initAv: 'marc', avs: ['marc'] });
                    if (!forceMarcAvatar()) {
                        var tries = 0;
                        var timer = setInterval(function () {
                            tries++;
                            if (forceMarcAvatar() || tries > 25) {
                                clearInterval(timer);
                            }
                        }, 200);
                    }
                } catch (e) {
                    console.error(e);
                }
            } else {
                console.error("CWASA is not available on the page.");
            }
        }

        window.playSiGML = playSiGML;

        window.addEventListener('load', initializeAvatar);

    </script>
</head>
<body style="margin: 0; background: #eee; overflow: hidden;">
    <div style="width: 100vw; height: 100vh;">
        <div class="CWASAAvatar av0" style="width: 100%; height: 100%;"></div>
    </div>
</body>
</html>
