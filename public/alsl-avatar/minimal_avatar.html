<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Minimal ALSL Avatar</title>
    <link rel="stylesheet" href="cwa/cwasa.css" />
    <script type="text/javascript" src="cwa/allcsa.js"></script>
    <script type="text/javascript">
        /**
         * Plays a SiGML string directly using the CWASA avatar.
         * @param {string} sigmlContent - The full XML content of the SiGML file.
         */
        function playSiGML(sigmlContent) {
            if (window.CWASA && typeof window.CWASA.playSiGMLText === 'function') {
                CWASA.playSiGMLText(sigmlContent);
            } else {
                console.error("CWASA is not initialized or playSiGMLText is not available.");
            }
        }

        function playFromXMLBox() {
            var xmlInput = document.getElementById("xmlInput");
            if (!xmlInput) {
                return;
            }

            var sigmlContent = xmlInput.value.trim();
            if (!sigmlContent) {
                return;
            }

            playSiGML(sigmlContent);
        }

        /**
         * Initializes the CWASA avatar system.
         * Should be called once the page is loaded.
         */
        function initializeAvatar() {
            if (window.CWASA && typeof window.CWASA.init === 'function') {
                CWASA.init();
            } else {
                console.error("CWASA is not available on the page.");
            }

            var xmlInput = document.getElementById("xmlInput");
            if (!xmlInput) {
                return;
            }

            xmlInput.addEventListener("keydown", function (event) {
                // Enter plays XML, Shift+Enter inserts a new line.
                if (event.key === "Enter" && !event.shiftKey) {
                    event.preventDefault();
                    playFromXMLBox();
                }
            });
        }

    </script>
</head>
<body onload="initializeAvatar();">
    <div style="max-width: 900px; margin: 0 auto; padding: 12px;">
        <textarea id="xmlInput" rows="10" style="width: 100%; box-sizing: border-box;" placeholder="الصقي SiGML XML هنا، ثم اضغطي Enter للتشغيل (Shift+Enter لسطر جديد)"></textarea>
        <div style="margin: 8px 0 14px 0;">
            <button type="button" onclick="playFromXMLBox()">Play XML</button>
        </div>
    </div>

    <div style="width: 500px; height: 500px; margin: auto;">
        <div class="CWASAAvatar av0" style="width: 100%; height: 100%;"></div>
    </div>
</body>
</html>
